<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Visual prompt method placeholder</title>
  <desc id="desc">A placeholder diagram showing retrieved text prompts guiding image captioning.</desc>
  <rect width="640" height="400" rx="24" fill="#fbfbfa"/>
  <rect x="28" y="34" width="584" height="332" rx="22" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="320" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#111827">Retrieval Text Visual Prompts</text>
  <rect x="72" y="120" width="180" height="136" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
  <circle cx="120" cy="172" r="24" fill="#f59e0b"/>
  <path d="M86 224 C122 182 172 226 236 160" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Georgia, serif" font-size="16" fill="#334155" font-style="italic">
    <rect x="318" y="116" width="240" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="140">"a person outdoors"</text>
    <rect x="318" y="168" width="240" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="192">"a backpack near a trail"</text>
    <rect x="318" y="220" width="240" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="244">"mountains in background"</text>
  </g>
  <path d="M260 188 C282 170 290 170 310 188" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="126" y="302" width="388" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="329" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">lightweight captioning with retrieved prompts</text>
</svg>
