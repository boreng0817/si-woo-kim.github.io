    <div class="keywords-box">
      <p>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span><strong>Research Keywords:</strong>
        {{ delimit .Site.Params.keywords ", " }}

      </p>
    </div>
  </div>
</section>
